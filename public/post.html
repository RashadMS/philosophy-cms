<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title>جاري التحميل... - رشاد(الموقع الرسمي)</title>

  <link rel="icon" href="/favicon.ico?v=2" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<header class="header">
  <div class="header__inner">
    <a href="/" class="header__logo">رشاد(الموقع الرسمي)</a>

    <nav class="nav">
      <button class="nav__toggle" id="navToggle"></button>

      <ul class="nav__links" id="navLinks">
        <li><a href="/">الرئيسية</a></li>
        <li><a href="/#articles">المقالات</a></li>
        <li><a href="/#research">الأبحاث</a></li>
        <li><a href="/#quotes">الحكم</a></li>
      </ul>

      <div class="nav__auth" id="navAuth"></div>
    </nav>
  </div>
</header>

<main>
  <article class="post" id="postContainer">
    <div class="loading">
      <div class="loading__spinner"></div>
    </div>
  </article>

  <section class="comments" id="commentsSection" style="display:none;">
    <h2>النقاش</h2>

    <div id="commentFormContainer" style="display:none;">
      <form id="commentForm">
        <textarea id="commentContent" rows="4" placeholder="اكتب تعليقاً..." required></textarea>
        <button type="submit" id="commentSubmitBtn">نشر</button>
      </form>
    </div>

    <div id="loginPrompt" style="display:none;">
      <a href="/login">سجل الدخول</a> لترك تعليق.
    </div>

    <div id="commentsList"></div>
  </section>
</main>

<footer class="footer">
  <div>© <script>document.write(new Date().getFullYear())</script> رشاد</div>
</footer>

<div class="toast-container" id="toastContainer"></div>

<!-- Scripts -->
<script src="/js/theme-manager.js"></script>
<script src="/js/app.js"></script>

<script>
const postId = window.location.pathname.split('/').pop();
let currentPost = null;
let replyingTo = null;

/* =========================
   Session ID (views fix)
========================= */
function getSessionId() {
  let sessionId = sessionStorage.getItem('postSessionId');
  if (!sessionId) {
    sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    sessionStorage.setItem('postSessionId', sessionId);
  }
  return sessionId;
}

/* =========================
   Load Post
========================= */
async function loadPost() {
  try {
    const token = localStorage.getItem('token');
    const headers = token ? { Authorization: `Bearer ${token}` } : {};

    const sessionId = getSessionId();
    const response = await fetch(`/api/posts/${postId}?sessionId=${sessionId}`, { headers });

    if (!response.ok) throw new Error('Post not found');

    const data = await response.json();
    currentPost = data.post;

    renderPost(currentPost);
    renderComments(currentPost.comments || []);

    document.title = `${currentPost.title} - رشاد`;

    document.getElementById('commentsSection').style.display = 'block';

    if (token) {
      document.getElementById('commentFormContainer').style.display = 'block';
      document.getElementById('loginPrompt').style.display = 'none';
    } else {
      document.getElementById('commentFormContainer').style.display = 'none';
      document.getElementById('loginPrompt').style.display = 'block';
    }

  } catch (err) {
    document.getElementById('postContainer').innerHTML = `
      <div class="empty">
        <h2>لم يتم العثور على المقال</h2>
        <a href="/">العودة</a>
      </div>
    `;
  }
}

/* =========================
   Render Post
========================= */
function renderPost(post) {
  const isQuote = post.category === 'Quote';
  const date = new Date(post.createdAt).toLocaleDateString();

  let content = '';

  if (isQuote) {
    content = `
      <div style="background: linear-gradient(135deg,#0d47a1,#1976d2); color:#fff; padding:2rem; border-radius:10px;">
        <blockquote style="font-size:1.8rem;">"${post.content}"</blockquote>
        ${post.quoteAuthor ? `<p>— ${post.quoteAuthor}</p>` : ''}
        <small>${post.authorName} • ${date} • ${post.views || 0} views</small>
      </div>
    `;
  } else {
    content = `
      <header>
        <h1>${post.title}</h1>
        <p>${post.authorName} • ${date} • ${post.views || 0} views</p>
      </header>

      ${post.coverImage ? `<img src="${post.coverImage}" style="width:100%;object-fit:cover;">` : ''}

      <div>${post.content}</div>
    `;
  }

  content += `
    <div>
      <button onclick="toggleLike()">❤️ ${post.likeCount}</button>
      <span>${post.commentCount} comments</span>
    </div>
  `;

  document.getElementById('postContainer').innerHTML = content;
}

/* =========================
   Comments
========================= */
function renderComments(comments) {
  const container = document.getElementById('commentsList');

  if (!comments.length) {
    container.innerHTML = "<p>لا توجد تعليقات</p>";
    return;
  }

  container.innerHTML = comments.map(c => `
    <div>
      <b>${c.author?.name || 'User'}</b>
      <p>${c.content}</p>
    </div>
  `).join('');
}

/* =========================
   Like
========================= */
async function toggleLike() {
  const token = localStorage.getItem('token');
  if (!token) return alert('Login first');

  const res = await fetch(`/api/posts/${postId}/like`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}` }
  });

  const data = await res.json();
  loadPost();
}

/* =========================
   Init
========================= */
loadPost();
</script>

</body>
</html>
