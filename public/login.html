<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تسجيل الدخول إلى حسابك في رشاد(الموقع الرسمي)">
  <title>تسجيل الدخول - رشاد(الموقع الرسمي)</title>
  
  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico?v=2" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth">
    <div class="auth__card">
      <div class="auth__header">
        <a href="/" class="auth__logo">رشاد(الموقع الرسمي)</a>
        <h1 class="auth__title">أهلاً وسهلاً</h1>
        <p class="auth__subtitle">سجل دخولك لمتابعة رحلتك الفكرية</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">بريد إلكتروني</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="your@email.com"
            required
            autocomplete="email"
          >
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">كلمة المرور</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="أدخل كلمة المرور"
            required
            autocomplete="current-password"
          >
        </div>
        
        <div id="formError" class="form-error hidden"></div>
        
        <button type="submit" class="btn btn--primary btn--lg" id="submitBtn">
          تسجيل الدخول
        </button>
      </form>
      
      <div class="auth__footer">
        <p>ليس لديك حساب؟ <a href="/register">أنشئ واحداً</a></p>
        <a href="/" class="btn btn--ghost" style="margin-top: 1rem; width: 100%; text-align: center;">← العودة للصفحة الرئيسية</a>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/theme-manager.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let unverifiedEmail = null;

    // Login form handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      const formError = document.getElementById('formError');
      
      // Reset error
      formError.classList.add('hidden');
      formError.textContent = '';
      
      // Disable button
      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري تسجيل الدخول...';
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          // Check if it's an unverified email error (403)
          if (response.status === 403 && data.requiresVerification) {
            unverifiedEmail = email;
            showUnverifiedMessage(email);
            submitBtn.disabled = false;
            submitBtn.textContent = 'تسجيل الدخول';
            return;
          }
          
          throw new Error(data.message || 'فشل تسجيل الدخول');
        }
        
        // Store token and user data
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        
        // Show success message
        showToast('تم تسجيل الدخول بنجاح! سيعاد توجيهك...', 'success');
        
        // Redirect based on role
        setTimeout(() => {
          if (data.user.role === 'Admin') {
            window.location.href = '/admin';
          } else {
            window.location.href = '/';
          }
        }, 1000);
        
      } catch (error) {
        formError.textContent = error.message;
        formError.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'تسجيل الدخول';
      }
    });
    
    // Show message for unverified email
    function showUnverifiedMessage(email) {
      const loginForm = document.getElementById('loginForm');
      const card = loginForm.parentElement;
      
      card.innerHTML = `
        <div class="auth__header">
          <a href="/" class="auth__logo">رشاد(الموقع الرسمي)</a>
          <h1 class="auth__title">تحقق من بريدك الإلكتروني</h1>
        </div>
        
        <div style="padding: 30px; text-align: center;">
          <div style="font-size: 48px; margin-bottom: 20px;">📧</div>
          
          <p style="font-size: 16px; margin-bottom: 15px; color: #333;">
            لم يتم التحقق من بريدك الإلكتروني بعد.
          </p>
          
          <p style="font-size: 14px; background-color: #f0f0f0; padding: 10px; border-radius: 6px; margin-bottom: 20px;">
            ${email}
          </p>
          
          <div style="background-color: #fff3cd; border-right: 4px solid #ffc107; padding: 15px; border-radius: 4px; margin-bottom: 20px; text-align: right;">
            <p style="margin: 0; color: #856404; font-size: 14px;">
              <strong>⚠️</strong> يجب التحقق من بريدك الإلكتروني قبل تسجيل الدخول.
            </p>
          </div>
          
          <p style="font-size: 14px; color: #666; margin-bottom: 20px;">
            تحقق من صندوق البريد الوارد واضغط على رابط التحقق.
            <br>إذا لم تجد البريد، تحقق من مجلد الرسائل العشوائية.
          </p>
          
          <button onclick="resendVerificationEmail('${email}')" class="btn btn--primary" style="background-color: #667eea; color: white; padding: 12px 30px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 15px;">
            إعادة إرسال البريد
          </button>
          
          <p style="font-size: 12px; margin-top: 20px;">
            <a href="/login" onclick="location.reload()" style="color: #667eea; text-decoration: none;">العودة</a>
          </p>
        </div>
      `;
    }
    
    // Resend verification email
    async function resendVerificationEmail(email) {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = 'جاري إعادة الإرسال...';
      
      try {
        const response = await fetch('/api/auth/resend-verification', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.message || 'فشل إعادة الإرسال');
        }
        
        showToast('تم إرسال البريد بنجاح!', 'success');
        btn.textContent = 'إعادة إرسال البريد';
        
        // Reset button after 30 seconds
        setTimeout(() => {
          btn.disabled = false;
        }, 30000);
        
      } catch (error) {
        showToast(error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'إعادة إرسال البريد';
      }
    }
    
    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      if (user.role === 'Admin') {
        window.location.href = '/admin';
      } else {
        window.location.href = '/';
      }
    }
  </script>
</body>
</html>
